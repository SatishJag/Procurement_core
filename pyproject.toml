[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-core"
version = "0.1.0"
description = "Vendor PreQual, bid evaluation and BOQ to PO engines with a FastAPI router"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["procurement_core*"]

[tool.setuptools.package-data]
"procurement_core.prequal" = ["rulebook.json"]
